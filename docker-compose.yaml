# This compose file holds all necessary external services for development
# Use the [docker-compose.prod.yaml](./docker-compose.prod.yaml) file for a local version of the prod version of this application

volumes:
  pgdata:
    name: pgdata

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
