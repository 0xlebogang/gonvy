volumes:
  pgdata:
    name: pgdata
  pgadmin_data:
    name: pgadmin_data

networks:
  db:
    name: db

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql"
    networks:
      - "db"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gonvy.com
      PGADMIN_DEFAULT_PASSWORD: gonvy
    ports:
      - "4443:80"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    depends_on:
      - "postgres"
    networks:
      - "db"
